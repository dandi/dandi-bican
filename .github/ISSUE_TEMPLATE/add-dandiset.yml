name: Suggest a dandiset
description: Ask for a BICAN dandiset to be added to the dashboard.
title: "Add dandiset "
body:
  - type: input
    id: dandiset
    attributes:
      label: Dandiset ID or link
      placeholder: "000636 or https://dandiarchive.org/dandiset/000636"
    validations:
      required: true
  - type: textarea
    id: bican
    attributes:
      label: How is it part of BICAN?
      description: For example, the BICAN grant that funded it, or the paper it supports.
    validations:
      required: false
