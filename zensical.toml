[project]
site_name = "BICAN Dandisets"
site_description = "Data from the BRAIN Initiative Cell Atlas Network (BICAN) on the DANDI Archive."
site_url = "https://dandi.github.io/dandi-bican/"
copyright = '<a href="https://github.com/dandi/dandi-bican">GitHub<svg class="bd-external" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13v10h-21v-19h12v2h-10v15h17v-8h2zm3-12h-10.988l4.035 4-6.977 7.07 2.828 2.828 6.977-7.07 4.125 4.172v-11z"/></svg></a>'
extra_css = ["stylesheets/dashboard.css"]
extra_javascript = ["javascripts/dashboard.js"]

# Build the site from the repository root, leaving out these files.
docs_dir = "."
exclude_docs = """
README.md
dandisets.yaml
requirements.txt
scripts/
zensical.toml
"""

nav = [
  { "Dashboard" = "index.md" },
]

[project.theme]
language = "en"
logo = "images/dandi-logo.svg"
favicon = "images/dandi-logo.svg"
features = ["navigation.top"]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Used by index.md.
[project.markdown_extensions]
attr_list = {}
md_in_html = {}

[project.plugins.search]
enabled = false

[project.extra]
generator = false
