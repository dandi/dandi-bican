# Site settings. See https://zensical.org/docs/setup/basics/
[project]
site_name = "BICAN Dandisets"
site_description = "Data from the BRAIN Initiative Cell Atlas Network (BICAN) on the DANDI Archive."
site_url = "https://kabilar.github.io/dandi-bican/"
repo_url = "https://github.com/kabilar/dandi-bican"
repo_name = "kabilar/dandi-bican"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/dashboard.css"]
extra_javascript = ["javascripts/dashboard.js"]

# To add a page: create a Markdown file in docs/ and list it here.
nav = [
  { "Dashboard" = "index.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.top",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/brain"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
